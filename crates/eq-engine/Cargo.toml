[package]
name = "eq-engine"
description = "Platform-agnostic real-time building blocks: FIFO, drift resampler, processor, handoff, denormal guard."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
eq-dsp = { path = "../eq-dsp" }
audioadapter-buffers = "4.0.0"
rubato = { version = "4.0.0", default-features = false }
rtrb = "0.3"
thiserror = "2"
triple_buffer = "8.1.1"

[dev-dependencies]
assert_no_alloc = "1"

# The denormal guard (MXCSR / FPCR) needs `unsafe`; this crate cannot inherit the
# workspace lints because they deny it.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
