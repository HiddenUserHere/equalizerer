[package]
name = "eq-pipewire"
description = "Linux backend: PipeWire registry, default-sink metadata, runtime null sink and streams."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
eq-core = { path = "../eq-core" }
eq-engine = { path = "../eq-engine" }

# PipeWire FFI needs `unsafe`; this crate cannot inherit the workspace lints because
# they deny it.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
