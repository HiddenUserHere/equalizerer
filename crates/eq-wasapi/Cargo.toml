[package]
name = "eq-wasapi"
description = "Windows backend: WASAPI, MMDevice, IPolicyConfig, device notifications and the audio pipeline."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
eq-core = { path = "../eq-core" }
eq-dsp = { path = "../eq-dsp" }
eq-engine = { path = "../eq-engine" }
crossbeam-channel = "0.5"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

# COM and WASAPI FFI need `unsafe`; this crate cannot inherit the workspace lints because
# they deny it.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
